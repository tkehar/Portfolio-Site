<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talha Ahmed Kehar | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>
    <div class="container">
        <header class="navbar">
            <div class="logo"><a href="index">TALHA AHMED KEHAR</a></div>
            <nav class="nav-links">
                <a href="index" class="nav-tab">About</a>
                <a href="projects" class="nav-tab">Projects</a>
                <a href="resume" class="nav-tab">Resume</a>
                <a href="contact" class="nav-tab active">Contact</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41z"/></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M12.1 20.9c-.3-.5-.7-1-1.2-1.4-1.1-.8-2.4-1.2-3.7-1.2H4c-.3 0-.5.2-.5.5v1.3c0 .3.2.5.5.5h3.2c1.1 0 2.2.4 3.1 1.1.2.1.4.1.6 0 .2-.1.3-.3.2-.5zM20 12c0-4.4-3.6-8-8-8s-8 3.6-8 8 3.6 8 8 8 8-3.6 8-8zm-2 0c0 3.3-2.7 6-6 6s-6-2.7-6-6 2.7-6 6-6 6 2.7 6 6z"/></svg>
                </button>
            </nav>
        </header>

        <main class="content-wrapper">
            <section id="contact" class="page-view active">
                <div class="contact-layout">
                    <div class="contact-visual">
                        <div class="boardgame-frame">
                            <img src="Assets/Profile_Banner.png" alt="Profile pic" class="contact-artwork">
                        </div>
                    </div>
                    <div class="contact-details">
                        <h2>Lets Connect!</h2>
                        <p class="contact-meta"><strong>Email:</strong> <a href="mailto:talha.a.kehar@gmail.com">talha.a.kehar@gmail.com</a></p>
                        <p class="contact-meta">Berlin, Germany</p>
                        
                        <div class="software-icons" style="margin-top: 24px;">
                            <div class="software-icon" data-tooltip="Email Me"><img src="Assets/Icons/Mail.png" alt="Mail" onclick="window.location.href='mailto:talha.a.kehar@gmail.com'"></div>
                            <div class="software-icon" data-tooltip="Resume"><img src="Assets/Icons/CV.png" alt="Resume" onclick="window.open('https://drive.google.com/file/d/1CWLHV35JuPkYnu6m-MDJmqtJCgySnnU7/view?usp=sharing')"></div>
                            <div class="software-icon" data-tooltip="Linkedin"><img src="Assets/Icons/Linkedin.png" alt="LinkedIn" onclick="window.open('https://www.linkedin.com/in/talha-kehar-8a89ba120/')"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
