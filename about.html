<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talha Ahmed Kehar | About</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
</head>
<body class="about-page">
    <script>
        (function () {
            var b = parseFloat(localStorage.getItem('brightness'));
            if (isNaN(b)) b = localStorage.getItem('theme') === 'light' ? 100 : 20;
            b = Math.max(0, Math.min(100, b));
            var t = b / 100;
            var v = Math.round(30 + 225 * t);
            var border = Math.round(51 + 183 * t);
            document.documentElement.style.setProperty('--page-bg', 'rgb(' + v + ',' + v + ',' + v + ')');
            document.documentElement.style.setProperty('--page-border', 'rgb(' + border + ',' + border + ',' + border + ')');
            if (b < 60) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
        })();
    </script>
    <div class="container">
        <header class="navbar">
            <div class="logo"><a href="index">TALHA AHMED KEHAR</a></div>
            <nav class="nav-links">
                <a href="index" class="nav-tab">Work</a>
                <a href="about" class="nav-tab active">About</a>
                <a href="resume" class="nav-tab">Resume</a>
                <label class="brightness-control" title="Brightness">
                    <input id="brightness-scale" class="brightness-scale" type="range" min="0" max="100" value="20" step="1" aria-label="Brightness">
                </label>
            </nav>
        </header>

        <main class="content-wrapper">
            <section id="about" class="page-view active">
                <div class="about-intro">
                    <div class="about-photo">
                        <img src="Assets/Profile_Banner.png" alt="Talha Ahmed Kehar">
                    </div>
                    <div class="about-info">
                        <h2>I am <span id="type-role" class="typing-pill"></span><br>building <span id="type-product" class="typing-pill"></span>.</h1>
                    </div>
                </div>

                <div class="about-footer">
                    <div class="connect-bar">
                        <div class="connect-icons">
                            <h4 class="connect-title">Connect with me</h4>
                            <a class="software-icon" data-tooltip="Email Me" href="mailto:talha.a.kehar@gmail.com"><img src="Assets/Icons/Mail.png" alt="Email"></a>
                            <a class="software-icon" data-tooltip="LinkedIn" href="https://www.linkedin.com/in/talha-kehar-8a89ba120/" target="_blank" rel="noopener"><img src="Assets/Icons/Linkedin.png" alt="LinkedIn"></a>
                        </div>
                    </div>

                    <div class="tools-ticker">
                        <div class="ticker-track">
                            <img src="Assets/Icons/Figma.svg" alt="Figma">
                            <img src="Assets/Icons/Adobe.svg" alt="Adobe Suite">
                            <img src="Assets/Icons/Blender.svg" alt="Blender">
                            <img src="Assets/Icons/Procreate.svg" alt="Procreate">
                            <img src="Assets/Icons/Unity.svg" alt="Unity 3D">
                            <img src="Assets/Icons/Touchdesigner.svg" alt="Touchdesigner">
                            <img src="Assets/Icons/VS Code.svg" alt="VS Code">
                            <img src="Assets/Icons/HTML.svg" alt="HTML">
                            <img src="Assets/Icons/JS.svg" alt="Javascript">
                            <img src="Assets/Icons/CSS.svg" alt="CSS">
                            <img src="Assets/Icons/Notion.svg" alt="Notion">
                            <img src="Assets/Icons/Miro.svg" alt="Miro">
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- TYPING WORD SWAP ---
            const roleEl = document.getElementById('type-role');
            const productEl = document.getElementById('type-product');

            const roles = [
                "a storyteller",
                "a UX designer",
                "an artist",
                "a technologist"
            ];

            const products = [
                "digital experiences",
                "installations",
                "design systems",
                "AI-powered products",
                "games"
            ];

            const sleep = ms => new Promise(res => setTimeout(res, ms));

            function typeText(el, text, speed = 80) {
                return new Promise(res => {
                    let i = 0;
                    (function step() {
                        el.textContent = text.slice(0, i + 1);
                        i++;
                        if (i < text.length) setTimeout(step, speed);
                        else res();
                    })();
                });
            }

            function deleteText(el, speed = 40) {
                return new Promise(res => {
                    const text = el.textContent;
                    let i = text.length;
                    (function step() {
                        el.textContent = text.slice(0, i - 1);
                        i--;
                        if (i > 0) setTimeout(step, speed);
                        else res();
                    })();
                });
            }

            async function runTypingLoop() {
                let roleIdx = 0;
                await typeText(roleEl, roles[roleIdx]);

                while (true) {
                    // Keep the current role while cycling through every product.
                    for (let p = 0; p < products.length; p++) {
                        await typeText(productEl, products[p]);
                        await sleep(1600);
                        await deleteText(productEl);
                        await sleep(150);
                    }
                    // Products exhausted for this role -> advance the role.
                    roleIdx = (roleIdx + 1) % roles.length;
                    await deleteText(roleEl);
                    await sleep(150);
                    await typeText(roleEl, roles[roleIdx]);
                    await sleep(150);
                }
            }

            if (roleEl && productEl) runTypingLoop();

            // --- TOOLS TICKER (duplicate the track so the loop is seamless) ---
            const tickerTrack = document.querySelector('.ticker-track');
            if (tickerTrack) tickerTrack.innerHTML += tickerTrack.innerHTML;
});
    </script>
    <script src="site.js"></script>
</body>
</html>
