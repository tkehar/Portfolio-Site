<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talha Ahmed Kehar | About</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
</head>
<body class="about-page">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>
    <div class="container">
        <header class="navbar">
            <div class="logo"><a href="index">TALHA AHMED KEHAR</a></div>
            <nav class="nav-links">
                <a href="index" class="nav-tab">Work</a>
                <a href="about" class="nav-tab active">About</a>
                <a href="resume" class="nav-tab">Resume</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <img class="sun-icon" src="Assets/Dark Mode.png" alt="Dark mode">
                    <img class="moon-icon" src="Assets/Light Mode.png" alt="Light mode">
                    <span class="toggle-label toggle-label-light">lights on</span>
                    <span class="toggle-label toggle-label-dark">lights off</span>
                </button>
            </nav>
        </header>

        <main class="content-wrapper">
            <section id="about" class="page-view active">
                <div class="about-intro">
                    <div class="about-photo">
                        <img src="Assets/Color-test.gif" alt="Talha Ahmed Kehar">
                    </div>
                    <div class="about-info">
                        <h2>I am <span id="type-role" class="typing-pill"></span><br>building <span id="type-product" class="typing-pill"></span>.</h1>
                    </div>
                </div>

                <div class="about-footer">
                    <div class="connect-bar">
                        <div class="connect-icons">
                            <h4 class="connect-title">Connect with me</h4>
                            <a class="software-icon" data-tooltip="Email Me" href="mailto:talha.a.kehar@gmail.com"><img src="Assets/Icons/Mail.png" alt="Email"></a>
                            <a class="software-icon" data-tooltip="LinkedIn" href="https://www.linkedin.com/in/talha-kehar-8a89ba120/" target="_blank" rel="noopener"><img src="Assets/Icons/Linkedin.png" alt="LinkedIn"></a>
                        </div>
                    </div>

                    <div class="tools-ticker">
                        <div class="ticker-track">
                            <span class="ticker-item" data-label="Figma"><img src="Assets/Icons/Figma.svg" alt="Figma"></span>
                            <span class="ticker-item" data-label="Adobe Suite"><img src="Assets/Icons/Adobe.svg" alt="Adobe Suite"></span>
                            <span class="ticker-item" data-label="Blender"><img src="Assets/Icons/Blender.svg" alt="Blender"></span>
                            <span class="ticker-item" data-label="Procreate"><img src="Assets/Icons/Procreate.svg" alt="Procreate"></span>
                            <span class="ticker-item" data-label="Unity 3D"><img src="Assets/Icons/Unity.svg" alt="Unity 3D"></span>
                            <span class="ticker-item" data-label="Touchdesigner"><img src="Assets/Icons/Touchdesigner.svg" alt="Touchdesigner"></span>
                            <span class="ticker-item" data-label="VS Code"><img src="Assets/Icons/VS Code.svg" alt="VS Code"></span>
                            <span class="ticker-item" data-label="HTML"><img src="Assets/Icons/HTML.svg" alt="HTML"></span>
                            <span class="ticker-item" data-label="Javascript"><img src="Assets/Icons/JS.svg" alt="Javascript"></span>
                            <span class="ticker-item" data-label="CSS"><img src="Assets/Icons/CSS.svg" alt="CSS"></span>
                            <span class="ticker-item" data-label="Notion"><img src="Assets/Icons/Notion.svg" alt="Notion"></span>
                            <span class="ticker-item" data-label="Miro"><img src="Assets/Icons/Miro.svg" alt="Miro"></span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- TYPING WORD SWAP ---
            const roleEl = document.getElementById('type-role');
            const productEl = document.getElementById('type-product');

            const roles = [
                "a storyteller",
                "a UX designer",
                "an artist",
                "a technologist"
            ];

            const products = [
                "digital experiences",
                "installations",
                "design systems",
                "AI-powered products",
                "games"
            ];

            const sleep = ms => new Promise(res => setTimeout(res, ms));

            function typeText(el, text, speed = 80) {
                return new Promise(res => {
                    let i = 0;
                    (function step() {
                        el.textContent = text.slice(0, i + 1);
                        i++;
                        if (i < text.length) setTimeout(step, speed);
                        else res();
                    })();
                });
            }

            function deleteText(el, speed = 40) {
                return new Promise(res => {
                    const text = el.textContent;
                    let i = text.length;
                    (function step() {
                        el.textContent = text.slice(0, i - 1);
                        i--;
                        if (i > 0) setTimeout(step, speed);
                        else res();
                    })();
                });
            }

            async function runTypingLoop() {
                let roleIdx = 0;
                await typeText(roleEl, roles[roleIdx]);

                while (true) {
                    // Keep the current role while cycling through every product.
                    for (let p = 0; p < products.length; p++) {
                        await typeText(productEl, products[p]);
                        await sleep(1600);
                        await deleteText(productEl);
                        await sleep(150);
                    }
                    // Products exhausted for this role -> advance the role.
                    roleIdx = (roleIdx + 1) % roles.length;
                    await deleteText(roleEl);
                    await sleep(150);
                    await typeText(roleEl, roles[roleIdx]);
                    await sleep(150);
                }
            }

            if (roleEl && productEl) runTypingLoop();

            // --- TOOLS TICKER: single set of logos that scrolls one way then
            //     back (ping-pong). Pauses on hover; each logo shows a label. ---
            const ticker = document.querySelector('.tools-ticker');
            const tickerTrack = document.querySelector('.ticker-track');
            let tickerAnim = null;

            function setupTicker() {
                if (!ticker || !tickerTrack) return;
                if (tickerAnim) { tickerAnim.cancel(); tickerAnim = null; }
                tickerTrack.style.transform = 'translateX(0)';
                const distance = tickerTrack.scrollWidth - ticker.clientWidth;
                if (distance > 4) {
                    tickerTrack.classList.remove('ticker-centered');
                    const duration = Math.max(6000, distance * 22); // ~ constant speed
                    tickerAnim = tickerTrack.animate(
                        [{ transform: 'translateX(0)' },
                         { transform: 'translateX(' + (-distance) + 'px)' }],
                        { duration: duration, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' }
                    );
                } else {
                    // Everything fits: centre it, no motion.
                    tickerTrack.classList.add('ticker-centered');
                }
            }

            if (ticker && tickerTrack) {
                setupTicker();

                // Pause the loop while hovering so labels are easy to read.
                ticker.addEventListener('mouseenter', () => { if (tickerAnim) tickerAnim.pause(); });
                ticker.addEventListener('mouseleave', () => { if (tickerAnim) tickerAnim.play(); });

                // Hover label per logo (fixed-position so it isn't clipped).
                const tip = document.createElement('div');
                tip.className = 'ticker-tooltip';
                document.body.appendChild(tip);
                tickerTrack.querySelectorAll('.ticker-item').forEach(item => {
                    item.addEventListener('mouseenter', () => {
                        tip.textContent = item.getAttribute('data-label') || '';
                        const r = item.getBoundingClientRect();
                        tip.style.left = (r.left + r.width / 2) + 'px';
                        tip.style.top = (r.top - 8) + 'px';
                        tip.classList.add('show');
                    });
                    item.addEventListener('mouseleave', () => tip.classList.remove('show'));
                });

                let tickerResizeTimer = null;
                window.addEventListener('resize', () => {
                    clearTimeout(tickerResizeTimer);
                    tickerResizeTimer = setTimeout(setupTicker, 200);
                });
            }

            // --- THEME TOGGLE LOGIC ---
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        });
    </script>
</body>
</html>
