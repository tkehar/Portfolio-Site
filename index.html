    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- AUTONOMOUS UNTETHERED 3D ROTATION LOOP ---
            const autoCube = document.getElementById('autoCube');
            let rotateX = -15;
            let rotateY = 45;

            function renderLoop() {
                rotateY += 0.25; 
                rotateX = -15 + Math.sin(rotateY * 0.02) * 8; // Soft programmatic rhythmic breathing wave
                
                if (autoCube) {
                    autoCube.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                }
                requestAnimationFrame(renderLoop);
            }
            renderLoop();

            // --- TYPING SUB-ROUTINE MODULE ---
            function createTypingEffect(elementId, words) {
                const element = document.getElementById(elementId);
                if (!element) return;

                let wordIdx = 0;
                let charIdx = 0;
                let isDeleting = false;

                function type() {
                    const currentWord = words[wordIdx];
                    let typeSpeed = 100;

                    if (isDeleting) {
                        charIdx--;
                        element.textContent = currentWord.substring(0, charIdx);
                        typeSpeed = 50;
                    } else {
                        charIdx++;
                        element.textContent = currentWord.substring(0, charIdx);
                    }

                    if (!isDeleting && charIdx === currentWord.length) {
                        isDeleting = true;
                        typeSpeed = 2000;
                    } else if (isDeleting && charIdx === 0) {
                        isDeleting = false;
                        wordIdx = (wordIdx + 1) % words.length;
                        typeSpeed = 500;
                    }

                    setTimeout(type, typeSpeed);
                }
                type();
            }

            createTypingEffect('typing-animation', ["Design", "Technology", "Product", "Strategy", "Storytelling","Prototyping","Civic Tech","Data Visualization"]);

            // --- THEME TOGGLE LOGIC ---
            const themeToggle = document.getElementById('theme-toggle');
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        });
    </script>
