<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talha Ahmed Kehar | Under Construction</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
</head>
<body class="about-page">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
    </script>
    <div class="container">
        <header class="navbar">
            <div class="logo"><a href="index">TALHA AHMED KEHAR</a></div>
            <nav class="nav-links">
                <a href="index" class="nav-tab">Work</a>
                <a href="about" class="nav-tab">About</a>
                <a href="resume" class="nav-tab">Resume</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <img class="sun-icon" src="Assets/Dark Mode.png" alt="Dark mode">
                    <img class="moon-icon" src="Assets/Light Mode.png" alt="Light mode">
                    <span class="toggle-label toggle-label-light">lights on</span>
                    <span class="toggle-label toggle-label-dark">lights off</span>
                </button>
            </nav>
        </header>

        <main class="content-wrapper">
            <section class="page-view active construction-view">
                <div class="construction-msg">
                    <img class="construction-gif" src="Assets/Color-test.gif" alt="Talha Ahmed Kehar">
                    <h1>This page is still being developed,<br>try visiting <a href="index">another project</a>.</h1>
                </div>
            </section>
        </main>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
