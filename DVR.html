<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="project-page dvr-project">
    <script>
        (function () {
            var b = parseFloat(localStorage.getItem('brightness'));
            if (isNaN(b)) b = localStorage.getItem('theme') === 'light' ? 100 : 20;
            b = Math.max(0, Math.min(100, b));
            var t = b / 100;
            var v = Math.round(30 + 225 * t);
            var border = Math.round(51 + 183 * t);
            document.documentElement.style.setProperty('--page-bg', 'rgb(' + v + ',' + v + ',' + v + ')');
            document.documentElement.style.setProperty('--page-border', 'rgb(' + border + ',' + border + ',' + border + ')');
            if (b < 60) document.body.classList.add('dark-mode');
            else document.body.classList.remove('dark-mode');
        })();
    </script>

    <div class="container">
        <header class="navbar">
            <div class="logo"><a href="index">TALHA AHMED KEHAR</a></div>
            <nav class="nav-links">
                <a href="index" class="nav-tab active">Work</a>
                <a href="about" class="nav-tab">About</a>
                <a href="resume" class="nav-tab">Resume</a>
                <label class="brightness-control" title="Brightness">
                    <input id="brightness-scale" class="brightness-scale" type="range" min="0" max="100" value="20" step="1" aria-label="Brightness">
                </label>
            </nav>
        </header>
        <div class="main-content project-content">
            <img src="Assets/DVR/DVR_Banner.png" alt="Header Image" class="header-image" style=" margin-bottom: 60px;">
            <div class="content-row">
                <div class="text-column" style="padding: 10%;">
                    <h1>DVR</h1>
                    <div>
                        <p>Role: Designer/Developer/ Curator</p>
                        <p>Year: 2026</p>
                         <p>Team: Sabeen Mahmud Forum</p>
                    <p>Project description for DVR goes here. This is a placeholder page.</p>
                </div>
            </div>
        </div>
    </div>

     <script src="site.js"></script>
</body>
</html>
