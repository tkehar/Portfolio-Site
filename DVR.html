<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVR</title>
    <link rel="stylesheet" href="styles.css">
    <script src="config.js" defer></script>
</head>
<body class="project-page dvr-project">
    <div class="container">
        <header class="navbar">
            <div class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">TALHA AHMED KEHAR</a></div>
            <nav class="nav-links">
                <a href="index" class="nav-tab">Work</a>
                <a href="about" class="nav-tab">About</a>
                <a href="resume" class="nav-tab">Resume</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <img class="sun-icon" src="Assets/Dark Mode.png" alt="Dark mode">
                    <img class="moon-icon" src="Assets/Light Mode.png" alt="Light mode">
                    <span class="toggle-label toggle-label-light">lights on</span>
                    <span class="toggle-label toggle-label-dark">lights off</span>
                </button>
            </nav>
        </header>
        <div class="main-content project-content">
            <img src="Assets/DVR/DVR_Banner.png" alt="Header Image" class="header-image" style=" margin-bottom: 60px;">
            <div class="content-row">
                <div class="text-column" style="padding: 10%;">
                    <h1>DVR</h1>
                    <div>
                        <p>Role: Designer/Developer/ Curator</p>
                        <p>Year: 2026</p>
                         <p>Team: Sabeen Mahmud Forum</p>
                    <p>Project description for DVR goes here. This is a placeholder page.</p>
                </div>
            </div>
        </div>
    </div>

     <script>
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    </script>
</body>
</html>
